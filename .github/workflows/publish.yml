name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get version from tag
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Check version is not SNAPSHOT
        run: |
          if [[ "$RELEASE_VERSION" == *"SNAPSHOT"* ]]; then
            echo "Cannot publish SNAPSHOT to Maven Central"
            exit 1
          fi

      - name: Run tests before publish
        run: ./gradlew test -x :kunefe-test:test

      - name: Publish to Maven Central
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          ./gradlew \
            :kunefe-proto:publishAllPublicationsToMavenCentral \
            :kunefe-client:publishAllPublicationsToMavenCentral \
            :kunefe-spring-boot-starter:publishAllPublicationsToMavenCentral \
            -PreleaseVersion=$RELEASE_VERSION
