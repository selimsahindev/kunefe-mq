<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" font-family="'Georgia', 'Times New Roman', serif">

  <!-- Background -->
  <rect width="960" height="600" fill="#fafaf8"/>

  <!-- Title -->
  <text x="480" y="48" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a1a" letter-spacing="1">Künefe MQ</text>
  <text x="480" y="68" text-anchor="middle" font-size="13" fill="#666" letter-spacing="2">A R C H I T E C T U R E</text>
  <line x1="200" y1="78" x2="760" y2="78" stroke="#ccc" stroke-width="1"/>

  <!-- ══════════════════════════════════════════ -->
  <!-- CLIENTS (left) -->
  <!-- ══════════════════════════════════════════ -->

  <!-- Producer -->
  <rect x="30" y="110" width="155" height="68" rx="4" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="30" y="110" width="155" height="22" rx="4" fill="#1a1a1a"/>
  <rect x="30" y="128" width="155" height="4" fill="#1a1a1a"/>
  <text x="107" y="126" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" letter-spacing="1">PRODUCER SERVICE</text>
  <text x="107" y="148" text-anchor="middle" font-size="11" fill="#333">Spring Boot App</text>
  <text x="107" y="165" text-anchor="middle" font-size="10" fill="#888" font-style="italic">KunefeTemplate.send()</text>

  <!-- Consumer A -->
  <rect x="30" y="240" width="155" height="68" rx="4" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="30" y="240" width="155" height="22" rx="4" fill="#1a1a1a"/>
  <rect x="30" y="258" width="155" height="4" fill="#1a1a1a"/>
  <text x="107" y="256" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" letter-spacing="1">CONSUMER A</text>
  <text x="107" y="278" text-anchor="middle" font-size="11" fill="#333">Spring Boot App</text>
  <text x="107" y="295" text-anchor="middle" font-size="10" fill="#888" font-style="italic">@KunefeListener</text>

  <!-- Consumer B -->
  <rect x="30" y="370" width="155" height="68" rx="4" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="30" y="370" width="155" height="22" rx="4" fill="#1a1a1a"/>
  <rect x="30" y="388" width="155" height="4" fill="#1a1a1a"/>
  <text x="107" y="386" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" letter-spacing="1">CONSUMER B</text>
  <text x="107" y="406" text-anchor="middle" font-size="11" fill="#333">Spring Boot App</text>
  <text x="107" y="423" text-anchor="middle" font-size="10" fill="#888" font-style="italic">@KunefeListener</text>

  <!-- ══════════════════════════════════════════ -->
  <!-- BROKER (center) -->
  <!-- ══════════════════════════════════════════ -->

  <!-- Broker outer frame -->
  <rect x="220" y="95" width="390" height="480" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="220" y="95" width="390" height="30" rx="6" fill="#1a1a1a"/>
  <rect x="220" y="113" width="390" height="12" fill="#1a1a1a"/>
  <text x="415" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" letter-spacing="2">K Ü N E F E   B R O K E R</text>

  <!-- gRPC Layer -->
  <rect x="242" y="142" width="346" height="72" rx="4" fill="#f5f5f3" stroke="#555" stroke-width="1"/>
  <text x="415" y="162" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a" letter-spacing="1">gRPC LAYER</text>
  <line x1="242" y1="167" x2="588" y2="167" stroke="#ccc" stroke-width="1"/>
  <text x="320" y="184" text-anchor="middle" font-size="10" fill="#555">ProducerGrpcService</text>
  <text x="415" y="184" text-anchor="middle" font-size="10" fill="#555">BrokerGrpcService</text>
  <text x="515" y="184" text-anchor="middle" font-size="10" fill="#555">ConsumerGrpcService</text>
  <text x="415" y="202" text-anchor="middle" font-size="9" fill="#888" font-style="italic">Thin adapter layer — no business logic</text>

  <!-- Domain Layer -->
  <rect x="242" y="228" width="346" height="85" rx="4" fill="#f5f5f3" stroke="#555" stroke-width="1"/>
  <text x="415" y="248" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a" letter-spacing="1">DOMAIN LAYER</text>
  <line x1="242" y1="253" x2="588" y2="253" stroke="#ccc" stroke-width="1"/>
  <text x="320" y="272" text-anchor="middle" font-size="10" fill="#555">TopicService</text>
  <text x="415" y="272" text-anchor="middle" font-size="10" fill="#555">ProducerService</text>
  <text x="515" y="272" text-anchor="middle" font-size="10" fill="#555">ConsumerService</text>
  <text x="415" y="291" text-anchor="middle" font-size="9" fill="#888" font-style="italic">Push-based delivery · At-least-once guarantee</text>
  <text x="415" y="305" text-anchor="middle" font-size="9" fill="#888" font-style="italic">Java 21 Virtual Threads — one per subscriber</text>

  <!-- Log Engine -->
  <rect x="242" y="327" width="163" height="90" rx="4" fill="#f5f5f3" stroke="#555" stroke-width="1"/>
  <text x="323" y="347" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a" letter-spacing="1">LOG ENGINE</text>
  <line x1="242" y1="352" x2="405" y2="352" stroke="#ccc" stroke-width="1"/>
  <text x="323" y="370" text-anchor="middle" font-size="10" fill="#555">Append-only log</text>
  <text x="323" y="386" text-anchor="middle" font-size="10" fill="#555">RandomAccessFile</text>
  <text x="323" y="402" text-anchor="middle" font-size="9" fill="#888" font-style="italic">Sequential disk writes</text>

  <!-- Offset Store -->
  <rect x="425" y="327" width="163" height="90" rx="4" fill="#f5f5f3" stroke="#555" stroke-width="1"/>
  <text x="506" y="347" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a" letter-spacing="1">OFFSET STORE</text>
  <line x1="425" y1="352" x2="588" y2="352" stroke="#ccc" stroke-width="1"/>
  <text x="506" y="370" text-anchor="middle" font-size="10" fill="#555">RocksDB</text>
  <text x="506" y="386" text-anchor="middle" font-size="10" fill="#555">Consumer groups</text>
  <text x="506" y="402" text-anchor="middle" font-size="9" fill="#888" font-style="italic">Persistent offsets</text>

  <!-- Storage -->
  <rect x="242" y="431" width="346" height="55" rx="4" fill="#f5f5f3" stroke="#555" stroke-width="1"/>
  <text x="415" y="451" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a" letter-spacing="1">PERSISTENT STORAGE</text>
  <line x1="242" y1="456" x2="588" y2="456" stroke="#ccc" stroke-width="1"/>
  <text x="323" y="474" text-anchor="middle" font-size="10" fill="#555">*.log files (disk)</text>
  <text x="506" y="474" text-anchor="middle" font-size="10" fill="#555">RocksDB files (disk)</text>

  <!-- Port labels -->
  <rect x="242" y="498" width="346" height="62" rx="4" fill="#1a1a1a"/>
  <text x="415" y="518" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" letter-spacing="1">DESIGN DECISIONS</text>
  <text x="415" y="536" text-anchor="middle" font-size="9" fill="#aaa">No partitions · Global ordering guaranteed · Single-log per topic</text>
  <text x="415" y="552" text-anchor="middle" font-size="9" fill="#aaa">Push-based (vs Kafka pull) · Schema-agnostic · Zero external deps</text>

  <!-- ══════════════════════════════════════════ -->
  <!-- CLIENT LIBRARY (right) -->
  <!-- ══════════════════════════════════════════ -->

  <!-- Spring Starter -->
  <rect x="650" y="110" width="275" height="85" rx="4" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="650" y="110" width="275" height="22" rx="4" fill="#1a1a1a"/>
  <rect x="650" y="128" width="275" height="4" fill="#1a1a1a"/>
  <text x="787" y="126" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" letter-spacing="1">SPRING BOOT STARTER</text>
  <text x="787" y="150" text-anchor="middle" font-size="10" fill="#555">kunefe-spring-boot-starter</text>
  <text x="787" y="167" text-anchor="middle" font-size="10" fill="#555">KunefeTemplate · @KunefeListener</text>
  <text x="787" y="183" text-anchor="middle" font-size="9" fill="#888" font-style="italic">Auto-configuration · Zero boilerplate</text>

  <!-- Client Core -->
  <rect x="650" y="225" width="275" height="85" rx="4" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="650" y="225" width="275" height="22" rx="4" fill="#1a1a1a"/>
  <rect x="650" y="243" width="275" height="4" fill="#1a1a1a"/>
  <text x="787" y="241" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" letter-spacing="1">CLIENT CORE</text>
  <text x="787" y="265" text-anchor="middle" font-size="10" fill="#555">kunefe-client</text>
  <text x="787" y="282" text-anchor="middle" font-size="10" fill="#555">KunefeClient · KunefeProducer</text>
  <text x="787" y="298" text-anchor="middle" font-size="9" fill="#888" font-style="italic">KunefeConsumer · gRPC stubs</text>

  <!-- Proto -->
  <rect x="650" y="340" width="275" height="68" rx="4" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="650" y="340" width="275" height="22" rx="4" fill="#1a1a1a"/>
  <rect x="650" y="358" width="275" height="4" fill="#1a1a1a"/>
  <text x="787" y="356" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" letter-spacing="1">PROTO CONTRACT</text>
  <text x="787" y="378" text-anchor="middle" font-size="10" fill="#555">kunefe-proto</text>
  <text x="787" y="395" text-anchor="middle" font-size="9" fill="#888" font-style="italic">BrokerService · ProducerService · ConsumerService</text>

  <!-- ══════════════════════════════════════════ -->
  <!-- ARROWS -->
  <!-- ══════════════════════════════════════════ -->

  <!-- Producer → Broker (Publish) -->
  <line x1="185" y1="144" x2="220" y2="170" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="188" y="152" font-size="9" fill="#333" font-weight="600">Publish</text>
  <text x="188" y="163" font-size="8" fill="#888">gRPC</text>

  <!-- Broker → Consumer A (Push) -->
  <line x1="220" y1="220" x2="185" y2="265" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="183" y="232" font-size="9" fill="#333" font-weight="600">Push</text>
  <text x="183" y="243" font-size="8" fill="#888">stream</text>

  <!-- Broker → Consumer B (Push) -->
  <line x1="220" y1="250" x2="185" y2="390" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Starter → Client -->
  <line x1="787" y1="195" x2="787" y2="225" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Client → Proto -->
  <line x1="787" y1="310" x2="787" y2="340" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Client → Broker (gRPC) -->
  <line x1="650" y1="268" x2="610" y2="215" stroke="#555" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowhead-gray)"/>
  <text x="618" y="248" font-size="9" fill="#555">gRPC</text>

  <!-- defs -->
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1a1a1a"/>
    </marker>
    <marker id="arrowhead-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
  </defs>

</svg>
